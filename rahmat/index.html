<style>
@font-face{font-family:'Manrope';src:url(./fonts/manrope-400.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Manrope';src:url(./fonts/manrope-500.woff2) format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Manrope';src:url(./fonts/manrope-700.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Manrope';src:url(./fonts/manrope-800.woff2) format('woff2');font-weight:800;font-style:normal;font-display:swap}
:root{
  --red:#FF4135;
  --red-text:#CC342A;
  --green:#1FA22F;
  --green-text:#188125;
  --tg:#2AABEE;
  --tg-dark:#229ED9;
  --navy:#141414;
  --cream:#FFF8F0;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  position:relative;
  font-family:'Manrope',Arial,sans-serif;
  color:var(--navy);
  background:
    radial-gradient(90% 55% at 15% -10%, rgb(42 171 238 / .18), transparent 60%),
    radial-gradient(80% 50% at 100% 0%, rgb(255 65 53 / .14), transparent 60%),
    radial-gradient(70% 60% at 90% 100%, rgb(31 162 47 / .12), transparent 60%),
    linear-gradient(160deg,#FFF6F5 0%,#F3FBF4 100%);
  -webkit-font-smoothing:antialiased;
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  padding:24px;
  overflow-x:hidden;
}
a{text-decoration:none;color:inherit}
#confetti-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* ---- floating background blobs ----
   filter:blur(50px) on 3 continuously-animated fixed elements was very
   expensive to repaint every frame (browser has to re-rasterize+blur on
   every transform tick) — replaced with a radial-gradient soft edge
   baked into the fill itself, same look, no runtime blur cost. */
.blob{position:fixed;border-radius:50%;opacity:.35;z-index:0;pointer-events:none}
.blob--1{width:340px;height:340px;background:radial-gradient(circle, var(--tg) 0%, var(--tg) 22%, transparent 68%);top:8%;left:6%;animation:float1 9s ease-in-out infinite}
.blob--2{width:280px;height:280px;background:radial-gradient(circle, var(--red) 0%, var(--red) 22%, transparent 68%);bottom:10%;right:8%;animation:float2 11s ease-in-out infinite}
.blob--3{width:220px;height:220px;background:radial-gradient(circle, var(--green) 0%, var(--green) 22%, transparent 68%);bottom:22%;left:10%;animation:float1 8s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-24px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,20px)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

.brand{
  position:relative;z-index:2;
  font-weight:800;font-size:20px;text-transform:uppercase;color:var(--red-text);
  animation:fadeUp .6s ease-out .05s forwards;
}
.brand span{color:var(--green-text)}

.card{
  position:relative;z-index:2;
  max-width:440px;width:100%;
  background:#fff;
  border-radius:26px;
  padding:clamp(36px,6vw,52px) clamp(24px,5vw,36px) clamp(30px,5vw,40px);
  text-align:center;
  box-shadow:0 30px 70px -22px rgb(20 20 20 / .22);
  overflow:hidden;
  animation:cardIn .55s cubic-bezier(.16,1,.3,1) .1s forwards;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--tg),var(--green),var(--red));
}
@keyframes cardIn{from{transform:translateY(24px) scale(.97)}to{transform:translateY(0) scale(1)}}
@keyframes fadeUp{from{transform:translateY(14px)}to{transform:translateY(0)}}

.check-wrap{position:relative;width:84px;height:84px;margin:0 auto 22px}
.check-wrap::before,.check-wrap::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  border:2px solid var(--green);opacity:0;
  animation:ring 2.2s cubic-bezier(0,0,.2,1) infinite;
}
.check-wrap::after{animation-delay:.5s}
@keyframes ring{
  0%{transform:scale(.7);opacity:.55}
  100%{transform:scale(1.7);opacity:0}
}
.check{
  position:relative;z-index:1;
  width:84px;height:84px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--green) 0%,#2ecc41 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 28px -10px rgb(31 162 47 / .5);
  animation:pop .55s cubic-bezier(.34,1.56,.64,1) .15s backwards;
}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

.card h1{
  margin:0;font-weight:800;font-size:clamp(22px,4vw,28px);text-transform:uppercase;line-height:1.2;
  animation:fadeUp .55s ease-out .3s forwards;
}
.card p.sub{
  margin:12px 0 0;color:#4b4b4b;font-size:15.5px;line-height:1.55;
  animation:fadeUp .55s ease-out .4s forwards;
}
.fast{
  margin-top:26px;padding-top:24px;border-top:1px solid rgb(20 20 20 / .08);
  animation:fadeUp .55s ease-out .52s forwards;
}
.fast p{margin:0 0 10px;font-weight:700;font-size:14px;color:var(--navy)}
.fast__arrow{display:flex;justify-content:center;margin-bottom:8px;color:var(--tg-dark);animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.fast__arrow{animation:none}}

.cta{
  position:relative;
  display:inline-flex;width:100%;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:17px 24px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--tg) 0%,var(--tg-dark) 100%);
  color:#fff;
  font-weight:800;
  font-size:16px;
  overflow:hidden;
  isolation:isolate;
  animation:glow 2s ease-in-out infinite;
}
.cta::after{
  content:'';position:absolute;top:-40%;left:-30%;width:30%;height:180%;
  background:linear-gradient(90deg,transparent,rgb(255 255 255 / .55),transparent);
  transform:translateX(0) skewX(-18deg);
  animation:sheen 3s linear .6s infinite;
  z-index:1;
}
.cta svg,.cta span{position:relative;z-index:2}
.cta:active{transform:scale(.97)}
@keyframes sheen{0%{transform:translateX(0) skewX(-18deg)}55%,100%{transform:translateX(500%) skewX(-18deg)}}
@keyframes glow{
  0%,100%{box-shadow:0 14px 28px -8px rgb(34 158 217 / .55)}
  50%{box-shadow:0 14px 34px -6px rgb(34 158 217 / .85)}
}
@media (prefers-reduced-motion:reduce){.cta{animation:none}.cta::after{animation:none}}
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>
<div class="blob blob--1"></div>
<div class="blob blob--2"></div>
<div class="blob blob--3"></div>

<div class="brand">Uz<span>turk</span></div>

<div class="card">
  <div class="check-wrap">
    <div class="check">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <h1>Rahmat! Arizangiz qabul qilindi</h1>
  <p class="sub">Tez orada mutaxassislarimiz siz bilan bog'lanadi va barcha savollaringizga javob beradi.</p>
  <div class="fast">
    <div class="fast__arrow">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 4v15M12 19l-6-6M12 19l6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <p>Tezroq ma'lumot olish uchun:</p>
    <a class="cta" href="https://t.me/m/Z9sl2KPUZjdi">
      <svg aria-hidden="true" focusable="false" width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M21.05 3.64 2.98 10.6c-1.23.49-1.22 1.17-.22 1.48l4.64 1.45 1.79 5.48c.22.6.36.84.75.84.37 0 .53-.17.73-.37l1.78-1.73 4.68 3.46c.86.48 1.48.23 1.7-.8l3.07-14.5c.32-1.26-.47-1.83-1.85-1.27Z" fill="#fff"/></svg>
      <span class="txt">Telegramdan yozish</span>
    </a>
  </div>
</div>

<script>
(function(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  function start(){

  var canvas = document.getElementById('confetti-canvas');
  var ctx = canvas.getContext('2d', {alpha:true, desynchronized:true});
  var W, H, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    W = canvas.width = innerWidth * dpr;
    H = canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  resize();
  addEventListener('resize', resize, {passive:true});

  var colors = ['#FF4135', '#2AABEE', '#1FA22F', '#FFC93C', '#7c3aed'];
  var pieces = [];

  function burst(count, originY){
    for (var i = 0; i < count; i++) {
      var isCircle = Math.random() < 0.35;
      pieces.push({
        x: Math.random() * W,
        y: originY - Math.random() * H * 0.3,
        w: (6 + Math.random() * 6) * dpr,
        h: (8 + Math.random() * 8) * dpr,
        circle: isCircle,
        color: colors[(i + pieces.length) % colors.length],
        speedY: (2 + Math.random() * 3) * dpr,
        speedX: (Math.random() - 0.5) * 2.4 * dpr,
        rot: Math.random() * Math.PI,
        rotSpeed: (Math.random() - 0.5) * 0.22
      });
    }
  }

  burst(42, -20 * dpr);
  setTimeout(function(){ burst(24, -20 * dpr); }, 500);

  var animStart = null;
  var lastFrame = 0;
  var DURATION = 1400;
  var FRAME_INTERVAL = 1000 / 30;
  function frame(ts){
    if (!animStart) animStart = ts;
    var elapsed = ts - animStart;
    if (elapsed < DURATION) {
      if (ts - lastFrame >= FRAME_INTERVAL) {
        lastFrame = ts;
        draw();
      }
      requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0, 0, W, H);
    }
  }
  function draw(){
    ctx.clearRect(0, 0, W, H);
    pieces.forEach(function(p){
      p.x += p.speedX;
      p.y += p.speedY;
      p.rot += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.circle) {
        ctx.beginPath();
        ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
    });
  }
  requestAnimationFrame(frame);

  try {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      var actx = new AudioCtx();
      var notes = [523.25, 659.25, 783.99];
      var t0 = actx.currentTime;
      notes.forEach(function(freq, i){
        var osc = actx.createOscillator();
        var gain = actx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        var tStart = t0 + i * 0.12;
        gain.gain.setValueAtTime(0, tStart);
        gain.gain.linearRampToValueAtTime(0.18, tStart + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, tStart + 0.5);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start(tStart);
        osc.stop(tStart + 0.55);
      });
    }
  } catch (err) {}

  }

  if (document.readyState === 'complete') {
    setTimeout(start, 0);
  } else {
    addEventListener('load', function(){ setTimeout(start, 0); });
  }
})();
</script>
